services:
  - type: web
    name: rss-discord-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: POLL_INTERVAL_DEFAULT_SECONDS
        value: "600"
      - key: CONCURRENT_POLL_LIMIT
        value: "5"
